<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام التقرير الشامل المطور</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
:root{--p:#2980b9;--d:#2c3e50;--r:#c0392b;--g:#27ae60;--o:#f39c12;--bg:#f4f6f9}
body{font-family:'Cairo', sans-serif; background:var(--bg); padding:20px; color: var(--d); padding-bottom: 120px;}
.box{background:#fff;padding:25px;border-radius:15px;max-width:1400px;margin:auto;box-shadow: 0 4px 20px rgba(0,0,0,0.05)}
h2{margin-top:0; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:25px}
.card{padding:20px;border-radius:12px;color:#fff;text-align:center;position: relative; overflow: hidden;}
.card h3 {margin: 0 0 10px; font-size: 1rem; opacity: 0.9;}
.card-val {font-size: 1.8em; font-weight: bold;}
.card i {position: absolute; top: 10px; left: 10px; opacity: 0.2; font-size: 3em;}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center; background: #f8f9fa; padding: 15px; border-radius: 10px;}
input,select,button{padding:10px 15px;border-radius:8px;border:1px solid #ddd; font-family: 'Cairo'; font-weight: 600; outline: none;}
button{background:var(--d);color:#fff;border:none;cursor:pointer;transition:0.2s; display: inline-flex; align-items: center; gap: 8px;}
button:hover{transform: translateY(-2px);}
button.refresh {background: var(--p);}
button.save-archive {background: #8e44ad; width: 100%; justify-content: center; font-size: 1.1em; margin-top: 5px;}
button.export-all {background: #27ae60; width: 100%; justify-content: center; font-size: 1.1em; margin-top: 5px;}

.tabs{display:flex;gap:10px;margin-bottom:0; border-bottom: 1px solid #ddd; overflow-x: auto;}
.tab{padding:12px 25px;background:transparent;border:none;border-bottom: 3px solid transparent; cursor:pointer; font-weight: 700; color: #7f8c8d; min-width: 120px; transition: 0.3s;}
.tab:hover {color: var(--p);}
.tab.active{color:var(--p);border-bottom-color:var(--p); background: rgba(41, 128, 185, 0.05);}
.tab-badge {background: #eee; color: #555; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-right: 5px;}

.table-responsive {overflow-x: auto; background: #fff; border-radius: 0 0 15px 15px; border: 1px solid #ddd; border-top: none; min-height: 300px;}
table{width:100%;border-collapse:collapse; min-width:1000px;}
th{background:#f8f9fa;color:var(--d);padding:15px; text-align: right; font-weight: 700;}
td{padding:12px 15px;border-bottom: 1px solid #eee; vertical-align: middle;}
tr:last-child td {border-bottom: none;}

.tag {padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold;}
.tag-delayed {background: #e8f6fd; color: var(--p);}
.tag-cash {background: #eafaf1; color: var(--g);}
.tag-debt {background: #fdeaea; color: var(--r);}
.tag-part {background: #fff3cd; color: #856404;}

.floating-bar {position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--d); color: #fff; padding: 15px 30px; border-radius: 50px; display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; transition: 0.4s; opacity: 0;}
.floating-bar.show {transform: translateX(-50%) translateY(0); opacity: 1;}

.expense-form {display: flex; gap: 10px; background: #fff5f5; padding: 15px; border-radius: 8px; align-items: end; margin-bottom: 15px;}
.expense-form div {flex: 1;}

/* تنسيق الأرشيف */
.history-item {border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background: #fdfdfd;}
.history-info strong {display: block; font-size: 1.1em; color: var(--d);}
.history-info span {color: #777; font-size: 0.9em;}
</style>
</head>
<body>
<div class="box">
    <h2><span><i class="fas fa-file-invoice-dollar"></i> نظام التقارير والمديونية</span></h2>
    <div class="controls">
        <button onclick="fetchData()" id="upBtn" class="refresh"><i class="fas fa-sync-alt"></i> تحديث البيانات</button>
        <span id="status" style="margin-right: 10px; font-weight: bold; color: var(--p);"></span>
        <div style="margin-right: auto; display:flex; gap:10px;">
            <select id="creatorFilter" onchange="handleFilterChange()"><option value="all">كل المناديب</option></select>
            <input id="searchInput" placeholder="بحث بالمرجع أو العميل..." onkeyup="renderCurrentTab()">
        </div>
    </div>

    <div class="stats">
        <div class="card" style="background:var(--r)"><i class="fas fa-wallet"></i><h3>المديونية (المختارة)</h3><span id="stat-debt" class="card-val">0</span></div>
        <div class="card" style="background:#c0392b"><i class="fas fa-minus-circle"></i><h3>المصروفات</h3><span id="stat-expense" class="card-val">0</span></div>
        <div class="card" style="background:var(--d)"><i class="fas fa-calculator"></i><h3>الصافي المستحق</h3><span id="stat-net" class="card-val">0</span></div>
        <div class="card" style="background:var(--p); opacity: 0.8;"><i class="fas fa-star"></i><h3>آجل (للمعلومة فقط)</h3><span id="stat-delayed" class="card-val">0</span></div>
    </div>

    <div style="display: flex; gap: 10px;">
        <button onclick="exportToExcel(false)" class="export-all"><i class="fas fa-file-excel"></i> تصدير (Excel) ملون</button>
        <button onclick="saveToHistory()" class="save-archive"><i class="fas fa-save"></i> حفظ المديونية للأرشيف</button>
    </div>

    <br>

    <div class="tabs">
        <button class="tab active" id="tab-delayed" onclick="switchTab('delayed')"><i class="fas fa-star"></i> الآجلة (تلقائي)<span id="badge-delayed" class="tab-badge">0</span></button>
        <button class="tab" id="tab-cash" onclick="switchTab('cash')"><i class="fas fa-wallet"></i> نقدية / كاش<span id="badge-cash" class="tab-badge">0</span></button>
        <button class="tab" id="tab-debt" onclick="switchTab('debt')"><i class="fas fa-file-invoice-dollar"></i> المديونية المختارة<span id="badge-debt" class="tab-badge">0</span></button>
        <button class="tab" id="tab-expenses" onclick="switchTab('expenses')"><i class="fas fa-gas-pump"></i> المصروفات<span id="badge-expenses" class="tab-badge">0</span></button>
        <button class="tab" id="tab-nicks" onclick="switchTab('nicks')"><i class="fas fa-user-tag"></i> المناديب</button>
        <button class="tab" id="tab-history" onclick="switchTab('history')"><i class="fas fa-history"></i> الأرشيف</button>
    </div>

    <div class="table-responsive" id="mainContainer">
        <table id="tbl">
            <thead id="tblHead">
                <tr>
                    <th style="width: 40px"><input type="checkbox" onchange="toggleAll(this)"></th>
                    <th>المرجع</th>
                    <th>العميل</th>
                    <th>المندوب</th>
                    <th>التاريخ</th>
                    <th>التصنيف</th>
                    <th>المبلغ المتبقي</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>

        <div id="expensesDiv" style="display:none; padding:20px;">
            <div class="expense-form">
                <div><label>الوصف</label><input id="expDesc" type="text" placeholder="بنزين، ديزل..."></div>
                <div><label>المبلغ</label><input id="expAmount" type="number" placeholder="0"></div>
                <div><button onclick="addExpense()" style="background:#c0392b; width:100%; justify-content:center"><i class="fas fa-plus"></i> إضافة</button></div>
            </div>
            <table style="width:100%">
                <thead><tr><th>الوصف</th><th>المندوب</th><th>التاريخ</th><th>المبلغ</th><th>حذف</th></tr></thead>
                <tbody id="expenseRows"></tbody>
            </table>
        </div>

        <div id="nicksDiv" style="display:none; padding:20px;">
            <h3>تخصيص أسماء المناديب</h3>
            <div id="nickRows"></div>
        </div>

        <div id="historyDiv" style="display:none; padding:20px;">
            <h3 style="color:var(--p)">سجل المديونيات المحفوظة</h3>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<div class="floating-bar" id="floatBar">
    <div>تم تحديد: <span id="selCount">0</span></div>
    <div id="actionButtons" style="margin-right:20px"></div>
</div>

<script>
const API_URL = "/api/get-data"; 
const TARGET_SKU_FALLBACK = "754500950512";
const STORAGE = {INVOICES:"sys_inv_v6",DEBT_IDS:"sys_debt_v6",EXPENSES:"sys_exp_v6",NICKS:"sys_nicks_v6", HISTORY:"sys_hist_v1"};
let invoices=[], debtIds=[], expenses=[], nicknames={}, historyLog=[], selectedIds=new Set(), currentTab='delayed';
let currentStats = { debt: 0, expenses: 0, net: 0, delayed: 0 };

function init(){
    invoices=JSON.parse(localStorage.getItem(STORAGE.INVOICES)||"[]");
    debtIds=JSON.parse(localStorage.getItem(STORAGE.DEBT_IDS)||"[]");
    expenses=JSON.parse(localStorage.getItem(STORAGE.EXPENSES)||"[]");
    nicknames=JSON.parse(localStorage.getItem(STORAGE.NICKS)||"{}");
    historyLog=JSON.parse(localStorage.getItem(STORAGE.HISTORY)||"[]");
    
    updateCreatorsList();
    calculateStats(); 
    renderCurrentTab();
}

async function fetchData(){
    const btn=document.getElementById("upBtn"),st=document.getElementById("status");
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الجلب...';
    try{
        const r=await fetch(API_URL);
        if(!r.ok) throw new Error("Server Error");
        const d=await r.json();
        const targetId=d.target_product?.id;
        const custMap={}; 
        if(d.customers?.customers) d.customers.customers.forEach(c=>custMap[c.id]=c.name);
        
        invoices=(d.invoices?.invoices||[]).map(inv=>{
            let isDelayed=false;
            if(targetId&&inv.line_items) isDelayed=inv.line_items.some(i=>i.product_id===targetId);
            else if(inv.line_items) isDelayed=inv.line_items.some(i=>i.sku===TARGET_SKU_FALLBACK||i.product_name?.includes("آجلة"));
            
            let dueAmount=parseFloat(inv.due_amount); 
            if(isNaN(dueAmount)) dueAmount=parseFloat(inv.total);
            
            return {
                id:inv.id,
                ref:inv.reference,
                customer:custMap[inv.contact_id]||inv.contact_name||"عميل عام",
                creator:inv.created_by,
                date:inv.issue_date,
                total:parseFloat(inv.total),
                due:dueAmount,
                status:inv.status,
                is_delayed:isDelayed
            };
        });
        localStorage.setItem(STORAGE.INVOICES,JSON.stringify(invoices));
        updateCreatorsList(); 
        calculateStats(); 
        renderCurrentTab();
        btn.innerHTML='<i class="fas fa-sync-alt"></i> تحديث'; 
        st.innerText="✅ تم"; 
        setTimeout(()=>st.innerText="",2000);
    }catch(e){
        console.error(e);
        btn.innerHTML='<i class="fas fa-sync-alt"></i> تحديث';
        st.innerText="❌ خطأ";
        alert("فشل جلب البيانات. تأكد من إعداد مفتاح API في Vercel.");
    }finally{
        btn.disabled=false;
    }
}

function handleFilterChange() { calculateStats(); renderCurrentTab(); }

function getFilteredInvoices(){
    const creator=document.getElementById("creatorFilter").value;
    const search=document.getElementById("searchInput").value.toLowerCase();
    
    return invoices.filter(inv=>{
        if(inv.status==="Draft"||inv.status==="Voided"||inv.status==="Paid"||inv.due<=0) return false;
        const creatorMatch=(creator==='all'||inv.creator===creator);
        if(!creatorMatch) return false;

        const inDebt=debtIds.includes(inv.id); 
        let tabMatch=false;
        if(currentTab==='debt') tabMatch=inDebt;
        else if(currentTab==='delayed') tabMatch=inv.is_delayed&&!inDebt;
        else if(currentTab==='cash') tabMatch=!inv.is_delayed&&!inDebt;
        
        const searchMatch=inv.ref.toLowerCase().includes(search)||inv.customer.toLowerCase().includes(search);
        return tabMatch&&searchMatch;
    });
}

function calculateStats(){
    const creator = document.getElementById("creatorFilter").value;
    const filteredExpenses = expenses.filter(e => creator === 'all' || e.creator === creator);
    const totalExp = filteredExpenses.reduce((a, b) => a + b.amount, 0);

    const debtInvoices = invoices.filter(inv => {
        return debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0 && inv.status !== 'Paid';
    });
    const totalDebt = debtInvoices.reduce((a, b) => a + b.due, 0);

    const delayedInvoices = invoices.filter(inv => {
        return inv.is_delayed && !debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0 && inv.status !== 'Paid';
    });
    const totalDelayed = delayedInvoices.reduce((a, b) => a + b.due, 0);

    const cashInvoices = invoices.filter(inv => {
        return !inv.is_delayed && !debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0 && inv.status !== 'Paid';
    });

    const net = totalDebt - totalExp;

    document.getElementById("stat-delayed").innerText = totalDelayed.toLocaleString();
    document.getElementById("stat-debt").innerText = totalDebt.toLocaleString();
    document.getElementById("stat-expense").innerText = totalExp.toLocaleString();
    document.getElementById("stat-net").innerText = net.toLocaleString();

    document.getElementById("badge-delayed").innerText = delayedInvoices.length;
    document.getElementById("badge-debt").innerText = debtInvoices.length;
    document.getElementById("badge-expenses").innerText = filteredExpenses.length;
    document.getElementById("badge-cash").innerText = cashInvoices.length;

    currentStats = { debt: totalDebt, expenses: totalExp, net: net, delayed: totalDelayed };
}

function renderCurrentTab(){
    const mainTable = document.getElementById("tbl");
    const expDiv = document.getElementById("expensesDiv");
    const nickDiv = document.getElementById("nicksDiv");
    const histDiv = document.getElementById("historyDiv");

    mainTable.style.display='none'; expDiv.style.display='none'; nickDiv.style.display='none'; histDiv.style.display='none';

    if(currentTab==='expenses'){ expDiv.style.display='block'; renderExpenses(); return; }
    if(currentTab==='nicks'){ nickDiv.style.display='block'; renderNicks(); return; }
    if(currentTab==='history'){ histDiv.style.display='block'; renderHistory(); return; }

    mainTable.style.display='table';
    selectedIds.clear(); updateFloatingBar(); 
    
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById("tab-"+currentTab)?.classList.add("active");

    const data=getFilteredInvoices(); 
    const tbody=document.getElementById("rows");
    tbody.innerHTML="";
    
    if(data.length===0){
        tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:30px;color:#999">لا توجد بيانات للعرض</td></tr>`;
        return;
    }
    
    data.forEach(inv=>{
        const nick=nicknames[inv.creator]||inv.creator;
        let tag=inv.is_delayed?'<span class="tag tag-delayed">آجلة</span>':'<span class="tag tag-cash">كاش</span>';
        if(debtIds.includes(inv.id)) tag='<span class="tag tag-debt">في المديونية</span>';
        
        let statusHtml='<span style="color:#f39c12">معلقة</span>';
        if(inv.status==='Partially Paid'||inv.due<inv.total) statusHtml='<span class="tag tag-part">مدفوعة جزئياً</span>';
        
        tbody.innerHTML+=`<tr onclick="rowClick(event, ${inv.id})">
            <td><input type="checkbox" class="row-chk" value="${inv.id}" onchange="toggleSelect(${inv.id})"></td>
            <td style="color:var(--p);font-weight:bold">${inv.ref}</td>
            <td>${inv.customer}</td>
            <td>${nick}</td>
            <td>${inv.date}</td>
            <td>${tag}</td>
            <td style="font-weight:bold">${inv.due.toLocaleString()}</td>
            <td>${statusHtml}</td>
        </tr>`;
    });
}

function renderExpenses(){
    const creator=document.getElementById("creatorFilter").value;
    const tbody=document.getElementById("expenseRows");
    tbody.innerHTML="";
    const filtered = expenses.filter(e=>creator==='all'||e.creator===creator);
    filtered.forEach(exp=>{
        const nick=nicknames[exp.creator]||exp.creator;
        tbody.innerHTML+=`<tr><td>${exp.desc}</td><td>${nick}</td><td>${exp.date}</td><td style="font-weight:bold; color:#c0392b">${exp.amount.toLocaleString()}</td><td><button onclick="delExpense(${exp.id})" style="background:#fff;color:red;padding:0"><i class="fas fa-trash"></i></button></td></tr>`;
    });
}
function addExpense(){
    const creator=document.getElementById("creatorFilter").value;
    if(creator==='all'){alert("يجب اختيار المندوب من القائمة العلوية أولاً!");return;}
    const desc=document.getElementById("expDesc").value;
    const amount=parseFloat(document.getElementById("expAmount").value);
    if(!desc||!amount) return;
    expenses.push({ id:Date.now(), desc: desc, amount: amount, date: new Date().toISOString().split('T')[0], creator: creator });
    localStorage.setItem(STORAGE.EXPENSES,JSON.stringify(expenses));
    document.getElementById("expDesc").value=""; document.getElementById("expAmount").value="";
    calculateStats(); renderExpenses();
}
function delExpense(id){
    if(!confirm("حذف المصروف؟"))return;
    expenses=expenses.filter(e=>e.id!==id);
    localStorage.setItem(STORAGE.EXPENSES,JSON.stringify(expenses));
    calculateStats(); renderExpenses();
}
function switchTab(tab){
    currentTab=tab;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById("tab-"+tab)?.classList.add("active");
    renderCurrentTab();
}
function toggleSelect(id){ if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id); updateFloatingBar(); }
function toggleAll(source){
    const checkboxes=document.querySelectorAll('.row-chk');
    checkboxes.forEach(c=>{ c.checked=source.checked; const id=parseInt(c.value); if(source.checked) selectedIds.add(id); else selectedIds.delete(id); });
    updateFloatingBar();
}
function rowClick(e, id){ if(e.target.tagName!=='INPUT' && e.target.tagName!=='BUTTON') { const chk=document.querySelector(`input[value="${id}"]`); if(chk){chk.checked=!chk.checked; toggleSelect(id);} } }
function updateFloatingBar(){
    const bar=document.getElementById("floatBar"); document.getElementById("selCount").innerText=selectedIds.size;
    if(selectedIds.size>0){
        bar.classList.add("show");
        const actionsDiv=document.getElementById("actionButtons");
        let buttonsHTML = "";
        if(currentTab==='delayed') buttonsHTML+=`<button onclick="moveToDebt()" style="background:#e74c3c">نقل للمديونية</button>`;
        else if(currentTab==='debt') buttonsHTML+=`<button onclick="removeFromDebt()" style="background:#f39c12">إزالة من المديونية</button>`;
        else if(currentTab==='cash') { buttonsHTML+=`<button onclick="markAsDelayed()" style="background:var(--p)">تحويل آجل</button><button onclick="moveToDebt()" style="background:#e74c3c">نقل للمديونية</button>`; }
        actionsDiv.innerHTML = buttonsHTML;
    } else { bar.classList.remove("show"); }
}
function moveToDebt(){ selectedIds.forEach(id=>{ if(!debtIds.includes(id)) debtIds.push(id); }); localStorage.setItem(STORAGE.DEBT_IDS,JSON.stringify(debtIds)); calculateStats(); renderCurrentTab(); }
function removeFromDebt(){ debtIds=debtIds.filter(id=>!selectedIds.has(id)); localStorage.setItem(STORAGE.DEBT_IDS,JSON.stringify(debtIds)); calculateStats(); renderCurrentTab(); }
function markAsDelayed(){ invoices.forEach(inv=>{ if(selectedIds.has(inv.id)) inv.is_delayed=true; }); localStorage.setItem(STORAGE.INVOICES,JSON.stringify(invoices)); renderCurrentTab(); }
function renderNicks(){ updateCreatorsList(); }
function updateCreatorsList(){
    const s=document.getElementById("creatorFilter"); const current=s.value;
    const allCreators = new Set(); invoices.forEach(i => allCreators.add(i.creator)); expenses.forEach(e => allCreators.add(e.creator));
    const creators=[...allCreators].filter(Boolean);
    s.innerHTML='<option value="all">كل المناديب</option>';
    creators.forEach(c=>{ const n=nicknames[c]||c; s.innerHTML+=`<option value="${c}">${n}</option>`; });
    s.value=current;
    const nickRows=document.getElementById("nickRows");
    if(nickRows && currentTab === 'nicks'){
        nickRows.innerHTML="";
        creators.forEach(c=>{
            const val=nicknames[c]||"";
            nickRows.innerHTML+=`<div style="margin-bottom:10px; display:flex; gap:10px; background:#f9f9f9; padding:10px;"><span style="width:200px;">${c}</span><input type="text" value="${val}" onchange="saveNick('${c}', this.value)" style="flex:1"></div>`;
        });
    }
}
function saveNick(creator, val){ if(val) nicknames[creator]=val; else delete nicknames[creator]; localStorage.setItem(STORAGE.NICKS,JSON.stringify(nicknames)); updateCreatorsList(); }

function saveToHistory(){
    const creator = document.getElementById("creatorFilter").value;
    if(creator === 'all' && !confirm("حفظ تقرير لكل المناديب؟")) return;
    const creatorName = creator === 'all' ? 'الكل' : (nicknames[creator] || creator);
    const activeDebt = invoices.filter(inv => debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0);
    const activeExp = expenses.filter(e => creator === 'all' || e.creator === creator);
    const activeDelay = invoices.filter(inv => inv.is_delayed && !debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0);

    if(!activeDebt.length && !activeExp.length){ alert("لا توجد بيانات للحفظ!"); return; }

    historyLog.push({ id: Date.now(), saveDate: new Date().toLocaleString('ar-EG'), creatorRaw: creator, creatorName: creatorName, totalDebt: currentStats.debt, totalExp: currentStats.expenses, net: currentStats.net, invoices: activeDebt, expenses: activeExp, delayedInvoices: activeDelay });
    localStorage.setItem(STORAGE.HISTORY, JSON.stringify(historyLog));
    alert("تم حفظ المديونية للأرشيف");
}
function renderHistory(){
    const list = document.getElementById("historyList"); list.innerHTML = "";
    const creator = document.getElementById("creatorFilter").value;
    const filtered = historyLog.filter(h => creator === 'all' || h.creatorRaw === creator).reverse();
    filtered.forEach(item => {
        list.innerHTML += `<div class="history-item"><div class="history-info"><strong>${item.creatorName}</strong><span>${item.saveDate} | الصافي: ${item.net.toLocaleString()}</span></div><div><button onclick='exportHistoryItem(${JSON.stringify(item)})' style="background:#27ae60"><i class="fas fa-download"></i></button><button onclick="deleteHistoryItem(${item.id})" style="background:#c0392b"><i class="fas fa-trash"></i></button></div></div>`;
    });
}
function deleteHistoryItem(id){ if(!confirm("حذف؟")) return; historyLog = historyLog.filter(h => h.id !== id); localStorage.setItem(STORAGE.HISTORY, JSON.stringify(historyLog)); renderHistory(); }
function exportHistoryItem(item){ generateColoredExcel(item.creatorName, item.invoices, item.expenses, item.delayedInvoices, {debt: item.totalDebt, expenses: item.totalExp, net: item.net}, item.saveDate); }
function exportToExcel(isHistory) {
    if(isHistory) return;
    const creator = document.getElementById("creatorFilter").value;
    const creatorName = creator === 'all' ? 'الكل' : (nicknames[creator] || creator);
    const debtInvoices = invoices.filter(inv => debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0);
    const filteredExpenses = expenses.filter(e => creator === 'all' || e.creator === creator);
    const delayedInvoices = invoices.filter(inv => inv.is_delayed && !debtIds.includes(inv.id) && (creator === 'all' || inv.creator === creator) && inv.due > 0);
    generateColoredExcel(creatorName, debtInvoices, filteredExpenses, delayedInvoices, currentStats, new Date().toISOString().split('T')[0]);
}

async function generateColoredExcel(name, debtInvs, exps, delayedInvs, stats, dateVal){
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('التقرير المالي', {views: [{rightToLeft: true}]});
    sheet.columns = [{ width: 30 }, { width: 25 }, { width: 15 }, { width: 15 }];
    
    // Header
    const titleRow = sheet.addRow(['التقرير المالي الشامل']);
    sheet.mergeCells(`A${titleRow.number}:D${titleRow.number}`);
    titleRow.font={size:16, bold:true, color:{argb:'FFFFFFFF'}}; titleRow.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2C3E50'}}; titleRow.alignment={horizontal:'center'};
    sheet.addRow(['المندوب:', name, 'التاريخ:', dateVal]).font={bold:true};
    sheet.addRow([]);

    // Summary
    const sumHead = sheet.addRow(['ملخص الحسابات']);
    sumHead.font={bold:true, color:{argb:'FFFFFFFF'}}; sumHead.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2980B9'}};
    sheet.addRow(['إجمالي المديونية', '', '', stats.debt]);
    sheet.addRow(['إجمالي المصروفات', '', '', stats.expenses]);
    sheet.addRow(['الصافي المستحق', '', '', stats.net]).font={bold:true, size:12, color:{argb:'FF0000FF'}};
    sheet.addRow([]);

    // Debt
    const debtHead = sheet.addRow(['تفاصيل المديونية']);
    sheet.mergeCells(`A${debtHead.number}:D${debtHead.number}`);
    debtHead.font={bold:true, color:{argb:'FFFFFFFF'}}; debtHead.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE74C3C'}}; debtHead.alignment={horizontal:'center'};
    sheet.addRow(['المرجع', 'العميل', 'التاريخ', 'المبلغ']).font={bold:true};
    debtInvs.forEach(i => sheet.addRow([i.ref, i.customer, i.date, i.due]));
    sheet.addRow(['المجموع', '', '', stats.debt]).font={bold:true};
    sheet.addRow([]);

    // Expenses
    const expHead = sheet.addRow(['تفاصيل المصروفات']);
    sheet.mergeCells(`A${expHead.number}:D${expHead.number}`);
    expHead.font={bold:true, color:{argb:'FFFFFFFF'}}; expHead.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC0392B'}}; expHead.alignment={horizontal:'center'};
    sheet.addRow(['الوصف', 'المندوب', 'التاريخ', 'المبلغ']).font={bold:true};
    exps.forEach(e => sheet.addRow([e.desc, name, e.date, e.amount]));
    sheet.addRow(['المجموع', '', '', stats.expenses]).font={bold:true};

    const buffer = await workbook.xlsx.writeBuffer();
    saveAs(new Blob([buffer]), `تقرير_${name}.xlsx`);
}

init();
</script>
