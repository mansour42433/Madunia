<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام التقرير الشامل (مديونية - آجل - مصروفات)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* تنسيقات CSS */
:root{--p:#2980b9;--d:#2c3e50;--r:#c0392b;--g:#27ae60;--o:#f39c12;--bg:#f4f6f9}
body{font-family:'Cairo', sans-serif; background:var(--bg); padding:20px; color: var(--d); padding-bottom: 100px;}

.box{background:#fff;padding:25px;border-radius:15px;max-width:1400px;margin:auto;box-shadow: 0 4px 20px rgba(0,0,0,0.05)}
h2{margin-top:0; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center}

/* كروت الإحصائيات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:25px}
.card{padding:20px;border-radius:12px;color:#fff;text-align:center;position: relative; overflow: hidden;}
.card h3 {margin: 0 0 10px; font-size: 1rem; opacity: 0.9;}
.card-val {font-size: 1.8em; font-weight: bold;}
.card i {position: absolute; top: 10px; left: 10px; opacity: 0.2; font-size: 3em;}

/* التحكم */
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center; background: #f8f9fa; padding: 15px; border-radius: 10px;}
input,select,button{padding:10px 15px;border-radius:8px;border:1px solid #ddd; font-family: 'Cairo'; font-weight: 600; outline: none;}
button{background:var(--d);color:#fff;border:none;cursor:pointer;transition:0.2s; display: inline-flex; align-items: center; gap: 8px;}
button:hover{transform: translateY(-2px);}
button.refresh {background: var(--p);}
button.export-all {background: #27ae60; width: 100%; justify-content: center; font-size: 1.1em; margin-top: 10px;}

/* التبويبات */
.tabs{display:flex;gap:10px;margin-bottom:0; border-bottom: 1px solid #ddd; overflow-x: auto;}
.tab{padding:12px 25px;background:transparent;border:none;border-bottom: 3px solid transparent; cursor:pointer; font-weight: 700; color: #7f8c8d; min-width: 120px; transition: 0.3s;}
.tab:hover {color: var(--p);}
.tab.active{color:var(--p);border-bottom-color:var(--p); background: rgba(41, 128, 185, 0.05);}
.tab-badge {background: #eee; color: #555; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-right: 5px;}

/* الجدول */
.table-responsive {overflow-x: auto; background: #fff; border-radius: 0 0 15px 15px; border: 1px solid #ddd; border-top: none; min-height: 300px;}
table{width:100%;border-collapse:collapse; min-width:1000px;}
th{background:#f8f9fa;color:var(--d);padding:15px; text-align: right; font-weight: 700;}
td{padding:12px 15px;border-bottom: 1px solid #eee; vertical-align: middle;}
tr:last-child td {border-bottom: none;}

/* الوسوم */
.tag {padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold;}
.tag-delayed {background: #e8f6fd; color: var(--p);}
.tag-cash {background: #eafaf1; color: var(--g);}
.tag-debt {background: #fdeaea; color: var(--r);}
.tag-part {background: #fff3cd; color: #856404;} /* لون خاص للمدفوعة جزئياً */

/* شريط الإجراءات */
.floating-bar {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--d); color: #fff; padding: 15px 30px; border-radius: 50px;
    display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
    transition: 0.4s; opacity: 0;
}
.floating-bar.show {transform: translateX(-50%) translateY(0); opacity: 1;}

/* نموذج المصروفات */
.expense-form {display: flex; gap: 10px; background: #fff5f5; padding: 15px; border-radius: 8px; align-items: end; margin-bottom: 15px;}
.expense-form div {flex: 1;}
.expense-form label {display: block; font-size: 0.8em; margin-bottom: 5px; color: #c0392b;}

</style>
</head>
<body>

<div class="box">
    <h2>
        <span><i class="fas fa-file-invoice-dollar"></i> نظام التقارير والمديونية</span>
    </h2>

    <div class="controls">
        <button onclick="fetchData()" id="upBtn" class="refresh"><i class="fas fa-sync-alt"></i> تحديث البيانات</button>
        <span id="status" style="margin-right: 10px; font-weight: bold; color: var(--p);"></span>
        
        <div style="margin-right: auto; display:flex; gap:10px;">
            <select id="creatorFilter" onchange="renderCurrentTab()">
                <option value="all">كل المناديب</option>
            </select>
            <input id="searchInput" placeholder="بحث بالمرجع أو العميل..." onkeyup="renderCurrentTab()">
        </div>
    </div>

    <div class="stats">
        <div class="card" style="background:var(--p)">
            <i class="fas fa-star"></i>
            <h3>إجمالي الآجل (المتبقي)</h3>
            <span id="stat-delayed" class="card-val">0</span>
        </div>
        <div class="card" style="background:var(--r)">
            <i class="fas fa-wallet"></i>
            <h3>إجمالي المديونية (النقدية)</h3>
            <span id="stat-debt" class="card-val">0</span>
        </div>
        <div class="card" style="background:#c0392b">
            <i class="fas fa-minus-circle"></i>
            <h3>إجمالي المصروفات</h3>
            <span id="stat-expense" class="card-val">0</span>
        </div>
        <div class="card" style="background:var(--d)">
            <i class="fas fa-calculator"></i>
            <h3>الصافي المستحق (كاش)</h3>
            <span id="stat-net" class="card-val">0</span>
        </div>
    </div>

    <button onclick="exportComprehensiveReport()" class="export-all"><i class="fas fa-file-excel"></i> تصدير التقرير الشامل (Excel)</button>
    <br><br>

    <div class="tabs">
        <button class="tab active" id="tab-delayed" onclick="switchTab('delayed')">
            <i class="fas fa-star"></i> الآجلة (تلقائي)
            <span id="badge-delayed" class="tab-badge">0</span>
        </button>
        
        <button class="tab" id="tab-cash" onclick="switchTab('cash')">
            <i class="fas fa-wallet"></i> نقدية / كاش
            <span id="badge-cash" class="tab-badge">0</span>
        </button>
        
        <button class="tab" id="tab-debt" onclick="switchTab('debt')">
            <i class="fas fa-file-invoice-dollar"></i> المديونية المختارة
            <span id="badge-debt" class="tab-badge">0</span>
        </button>
        
        <button class="tab" id="tab-expenses" onclick="switchTab('expenses')">
            <i class="fas fa-gas-pump"></i> المصروفات
            <span id="badge-expenses" class="tab-badge">0</span>
        </button>

        <button class="tab" id="tab-nicks" onclick="switchTab('nicks')">
            <i class="fas fa-user-tag"></i> أسماء المناديب
        </button>
    </div>

    <div class="table-responsive" id="mainContainer">
        <table id="tbl">
            <thead id="tblHead">
                <tr>
                    <th style="width: 40px"><input type="checkbox" onchange="toggleAll(this)"></th>
                    <th>المرجع</th>
                    <th>العميل</th>
                    <th>المندوب</th>
                    <th>التاريخ</th>
                    <th>التصنيف</th>
                    <th>المبلغ المتبقي</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>

        <div id="expensesDiv" style="display:none; padding:20px;">
            <div class="expense-form">
                <div>
                    <label>الوصف</label>
                    <input id="expDesc" type="text" placeholder="بنزين، ديزل، غداء...">
                </div>
                <div>
                    <label>المبلغ</label>
                    <input id="expAmount" type="number" placeholder="0">
                </div>
                <div>
                    <button onclick="addExpense()" style="background:#c0392b; width:100%; justify-content:center">
                        <i class="fas fa-plus"></i> إضافة
                    </button>
                </div>
            </div>
            <table style="width:100%">
                <thead>
                    <tr>
                        <th>الوصف</th>
                        <th>المندوب</th>
                        <th>التاريخ</th>
                        <th>المبلغ</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="expenseRows"></tbody>
            </table>
        </div>

        <div id="nicksDiv" style="display:none; padding:20px;">
            <h3>تخصيص أسماء المناديب</h3>
            <div id="nickRows"></div>
        </div>
    </div>
</div>

<div class="floating-bar" id="floatBar">
    <div>تم تحديد: <span id="selCount">0</span></div>
    <div id="actionButtons" style="margin-right:20px"></div>
</div>

<script>
// --- إعدادات النظام ---
const API_URL = "/api/get-data"; 
const TARGET_SKU_FALLBACK = "754500950512";

const STORAGE = {
    INVOICES: "sys_inv_v6",
    DEBT_IDS: "sys_debt_v6",
    EXPENSES: "sys_exp_v6",
    NICKS: "sys_nicks_v6"
};

let invoices = [];
let debtIds = []; 
let expenses = [];
let nicknames = {};
let selectedIds = new Set(); 
let currentTab = 'delayed'; 

function init() {
    invoices = JSON.parse(localStorage.getItem(STORAGE.INVOICES) || "[]");
    debtIds = JSON.parse(localStorage.getItem(STORAGE.DEBT_IDS) || "[]");
    expenses = JSON.parse(localStorage.getItem(STORAGE.EXPENSES) || "[]");
    nicknames = JSON.parse(localStorage.getItem(STORAGE.NICKS) || "{}");
    
    updateCreatorsList();
    renderCurrentTab();
}

async function fetchData() {
    const btn = document.getElementById("upBtn");
    const st = document.getElementById("status");
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الجلب...';
    
    try {
        const r = await fetch(API_URL);
        const d = await r.json();
        const targetId = d.target_product?.id;
        
        const custMap = {};
        d.customers?.customers?.forEach(c => custMap[c.id] = c.name);

        invoices = (d.invoices?.invoices || []).map(inv => {
            let isDelayed = false;
            if (targetId && inv.line_items) isDelayed = inv.line_items.some(i => i.product_id === targetId);
            else if (inv.line_items) isDelayed = inv.line_items.some(i => i.sku === TARGET_SKU_FALLBACK || i.product_name?.includes("آجلة"));

            // هنا نحسب المبلغ المتبقي (Due Amount) بدلاً من الإجمالي
            let dueAmount = parseFloat(inv.due_amount);
            if(isNaN(dueAmount)) dueAmount = parseFloat(inv.total); // احتياط

            return {
                id: inv.id,
                ref: inv.reference,
                customer: custMap[inv.contact_id] || inv.contact_name || "عميل عام",
                creator: inv.created_by,
                date: inv.issue_date,
                total: parseFloat(inv.total), // نحتفظ بالإجمالي للعرض فقط
                due: dueAmount, // هذا ما سنستخدمه في الحسابات
                status: inv.status,
                is_delayed: isDelayed
            };
        });

        localStorage.setItem(STORAGE.INVOICES, JSON.stringify(invoices));
        updateCreatorsList();
        renderCurrentTab();
        
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
        st.innerText = "✅ تم"; setTimeout(()=>st.innerText="", 2000);

    } catch(e) {
        console.error(e);
        btn.innerHTML = 'فشل';
        st.innerText = "❌ خطأ";
    } finally { btn.disabled = false; }
}

function getFilteredInvoices() {
    const creator = document.getElementById("creatorFilter").value;
    const search = document.getElementById("searchInput").value.toLowerCase();

    return invoices.filter(inv => {
        // --- قواعد الاستبعاد الصارمة ---
        if (inv.status === "Draft") return false;
        if (inv.status === "Voided") return false;
        if (inv.status === "Paid") return false; // استبعاد المدفوعة نهائياً
        // إذا كان المبلغ المتبقي 0، نعتبرها مدفوعة ولا نظهرها
        if (inv.due <= 0) return false; 
        // -----------------------------
        
        const inDebt = debtIds.includes(inv.id);
        let tabMatch = false;

        if (currentTab === 'debt') tabMatch = inDebt; 
        else if (currentTab === 'delayed') tabMatch = inv.is_delayed && !inDebt; 
        else if (currentTab === 'cash') tabMatch = !inv.is_delayed && !inDebt; 

        const creatorMatch = (creator === 'all' || inv.creator === creator);
        const searchMatch = inv.ref.toLowerCase().includes(search) || inv.customer.toLowerCase().includes(search);

        return tabMatch && creatorMatch && searchMatch;
    });
}

function renderCurrentTab() {
    document.getElementById("tbl").style.display = (currentTab === 'expenses' || currentTab === 'nicks') ? 'none' : 'table';
    document.getElementById("expensesDiv").style.display = (currentTab === 'expenses') ? 'block' : 'none';
    document.getElementById("nicksDiv").style.display = (currentTab === 'nicks') ? 'block' : 'none';
    
    selectedIds.clear();
    updateFloatingBar();
    calculateStats();

    if(currentTab === 'expenses') { renderExpenses(); return; }
    if(currentTab === 'nicks') { renderNicks(); return; }

    const data = getFilteredInvoices();
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";

    if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:#999">لا توجد فواتير مستحقة</td></tr>`;
        return;
    }

    data.forEach(inv => {
        const nick = nicknames[inv.creator] || inv.creator;
        
        // تصنيف الفاتورة
        let tag = inv.is_delayed ? '<span class="tag tag-delayed">آجلة</span>' : '<span class="tag tag-cash">كاش</span>';
        if(debtIds.includes(inv.id)) tag = '<span class="tag tag-debt">في المديونية</span>';

        // حالة الدفع (مدفوع جزئياً أم لا)
        let statusHtml = '<span style="color:#f39c12">معلقة</span>';
        if(inv.status === 'Partially Paid' || (inv.due < inv.total)) {
            statusHtml = '<span class="tag tag-part">مدفوعة جزئياً</span>';
        }

        // عرض المبلغ (إذا جزئي نظهر المتبقي مع الإجمالي مشطوب)
        let amountDisplay = `<span style="font-weight:bold; font-size:1.1em">${inv.due.toLocaleString()}</span>`;
        if(inv.due < inv.total) {
            amountDisplay = `
                <div style="color:#c0392b; font-weight:bold; font-size:1.1em">${inv.due.toLocaleString()}</div>
                <div style="color:#aaa; text-decoration:line-through; font-size:0.85em">${inv.total.toLocaleString()}</div>
            `;
        }

        tbody.innerHTML += `
        <tr onclick="rowClick(event, ${inv.id})">
            <td><input type="checkbox" class="row-chk" value="${inv.id}" onchange="toggleSelect(${inv.id})"></td>
            <td style="color:var(--p);font-weight:bold">${inv.ref}</td>
            <td>${inv.customer}</td>
            <td>${nick}</td>
            <td>${inv.date}</td>
            <td>${tag}</td>
            <td>${amountDisplay}</td>
            <td>${statusHtml}</td>
        </tr>`;
    });
}

// --- المصروفات ---
function renderExpenses() {
    const creator = document.getElementById("creatorFilter").value;
    const tbody = document.getElementById("expenseRows");
    tbody.innerHTML = "";
    const filtered = expenses.filter(e => creator === 'all' || e.creator === creator);

    filtered.forEach(exp => {
        const nick = nicknames[exp.creator] || exp.creator;
        tbody.innerHTML += `
        <tr>
            <td>${exp.desc}</td>
            <td>${nick}</td>
            <td>${exp.date}</td>
            <td style="font-weight:bold; color:#c0392b">${exp.amount.toLocaleString()}</td>
            <td><button onclick="delExpense(${exp.id})" style="background:#fff;color:red;padding:0"><i class="fas fa-trash"></i></button></td>
        </tr>`;
    });
}

function addExpense() {
    const creator = document.getElementById("creatorFilter").value;
    if(creator === 'all') { alert("يجب اختيار المندوب أولاً!"); return; }
    const desc = document.getElementById("expDesc").value;
    const amount = parseFloat(document.getElementById("expAmount").value);
    if(!desc || !amount) return;

    expenses.push({ id: Date.now(), desc, amount, creator, date: new Date().toISOString().slice(0,10) });
    localStorage.setItem(STORAGE.EXPENSES, JSON.stringify(expenses));
    document.getElementById("expDesc").value = "";
    document.getElementById("expAmount").value = "";
    renderCurrentTab();
}

function delExpense(id) {
    if(!confirm("حذف؟")) return;
    expenses = expenses.filter(e => e.id !== id);
    localStorage.setItem(STORAGE.EXPENSES, JSON.stringify(expenses));
    renderCurrentTab();
}

// --- الحسابات (تعتمد على inv.due) ---
function calculateStats() {
    const creator = document.getElementById("creatorFilter").value;
    let sDelayed = 0, sDebt = 0, sExp = 0;
    
    // الفواتير التي تخص المندوب وغير مدفوعة بالكامل
    const relevantInvoices = invoices.filter(i => (creator === 'all' || i.creator === creator) && i.due > 0 && i.status !== 'Draft');

    relevantInvoices.forEach(inv => {
        // إذا كانت آجلة (سواء في المديونية أو لا) نحسبها في إجمالي الآجل
        if(inv.is_delayed) {
            sDelayed += inv.due;
        } 
        
        // المديونية = (النقدية التي تم نقلها للقائمة)
        // ملاحظة: نستخدم inv.due دائماً
        if(debtIds.includes(inv.id) && !inv.is_delayed) {
            sDebt += inv.due;
        }
    });

    const relevantExp = expenses.filter(e => creator === 'all' || e.creator === creator);
    relevantExp.forEach(e => { sExp += e.amount; });

    document.getElementById("stat-delayed").innerText = sDelayed.toLocaleString();
    document.getElementById("stat-debt").innerText = sDebt.toLocaleString();
    document.getElementById("stat-expense").innerText = sExp.toLocaleString();
    document.getElementById("stat-net").innerText = (sDebt - sExp).toLocaleString();

    // عداد التبويبات
    const pendingDelayed = invoices.filter(i => i.is_delayed && !debtIds.includes(i.id) && i.due > 0 && (creator === 'all' || i.creator === creator));
    document.getElementById("badge-delayed").innerText = pendingDelayed.length;

    const debtListCount = invoices.filter(i => debtIds.includes(i.id) && !i.is_delayed && i.due > 0 && (creator === 'all' || i.creator === creator));
    document.getElementById("badge-debt").innerText = debtListCount.length;
    
    document.getElementById("badge-expenses").innerText = relevantExp.length;
}

// --- التصدير ---
function exportComprehensiveReport() {
    const creator = document.getElementById("creatorFilter").value;
    
    const debtList = invoices.filter(inv => 
        (creator === 'all' || inv.creator === creator) && 
        debtIds.includes(inv.id) && 
        !inv.is_delayed && inv.due > 0
    );

    const delayedList = invoices.filter(inv => 
        (creator === 'all' || inv.creator === creator) && 
        inv.is_delayed && inv.status !== 'Draft' && inv.due > 0
    );

    const expList = expenses.filter(e => creator === 'all' || e.creator === creator);

    // استخدام due بدلاً من total
    const totalDebt = debtList.reduce((a,b)=>a+b.due,0);
    const totalDelayed = delayedList.reduce((a,b)=>a+b.due,0);
    const totalExp = expList.reduce((a,b)=>a+b.amount,0);
    const netDue = totalDebt - totalExp;

    let csv = "\uFEFF"; 
    const agentName = creator === 'all' ? "الكل" : (nicknames[creator] || creator);
    csv += `تقرير المديونية - المندوب: ${agentName}\n`;
    csv += `تاريخ التقرير: ${new Date().toISOString().slice(0,10)}\n\n`;

    csv += `--- أولاً: مديونية العملاء (النقدية/الكاش المتبقي) ---\n`;
    csv += `المرجع,العميل,التاريخ,المتبقي للدفع\n`;
    debtList.forEach(i => {
        csv += `${i.ref},"${i.customer}",${i.date},${i.due}\n`;
    });
    csv += `,,,الإجمالي: ${totalDebt}\n\n`;

    csv += `--- ثانياً: الفواتير الآجلة (المتبقي) ---\n`;
    csv += `المرجع,العميل,التاريخ,المتبقي للدفع\n`;
    delayedList.forEach(i => {
        csv += `${i.ref},"${i.customer}",${i.date},${i.due}\n`;
    });
    csv += `,,,الإجمالي: ${totalDelayed}\n\n`;

    csv += `--- ثالثاً: المصروفات ---\n`;
    csv += `الوصف,التاريخ,المبلغ\n`;
    expList.forEach(e => {
        csv += `${e.desc},${e.date},${e.amount}\n`;
    });
    csv += `,,الإجمالي: ${totalExp}\n\n`;

    csv += `--- الخلاصة ---\n`;
    csv += `إجمالي الكاش المستلم,${totalDebt}\n`;
    csv += `يخصم المصروفات,-${totalExp}\n`;
    csv += `الصافي الواجب تسليمه,${netDue}\n`;

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Report_${agentName}_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

// --- الوظائف المساعدة ---
function switchTab(t) {
    currentTab = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    renderCurrentTab();
}

function updateCreatorsList() {
    const s = document.getElementById("creatorFilter");
    const old = s.value;
    const allC = [...new Set(invoices.map(i=>i.creator))];
    s.innerHTML = '<option value="all">كل المناديب</option>';
    allC.forEach(c => {
        if(c) s.innerHTML += `<option value="${c}">${nicknames[c]||c}</option>`;
    });
    s.value = old;
}

function renderNicks() {
    const d = document.getElementById("nickRows"); d.innerHTML = "";
    const emails = [...new Set(invoices.map(i=>i.creator))].filter(e=>e);
    emails.forEach(e => {
        d.innerHTML += `<div style="margin-bottom:10px;display:flex;gap:10px;align-items:center;background:#f9f9f9;padding:10px;border-radius:5px">
            <span style="flex:1">${e}</span>
            <input value="${nicknames[e]||''}" onchange="nicknames['${e}']=this.value;localStorage.setItem(STORAGE.NICKS,JSON.stringify(nicknames));updateCreatorsList()" placeholder="الاسم" style="flex:1">
        </div>`;
    });
}

function toggleSelect(id) {
    if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    updateFloatingBar();
}
function toggleAll(source) {
    document.querySelectorAll('.row-chk').forEach(c => {
        c.checked = source.checked;
        const id = parseInt(c.value);
        if(source.checked) selectedIds.add(id); else selectedIds.delete(id);
    });
    updateFloatingBar();
}
function rowClick(e, id) {
    if(e.target.type!=='checkbox') {
        const c = document.querySelector(`.row-chk[value="${id}"]`);
        if(c) { c.checked = !c.checked; toggleSelect(id); }
    }
}
function updateFloatingBar() {
    const bar = document.getElementById("floatBar");
    const bDiv = document.getElementById("actionButtons");
    document.getElementById("selCount").innerText = selectedIds.size;
    
    if(selectedIds.size > 0) {
        bar.classList.add("show");
        if(currentTab === 'debt') {
            bDiv.innerHTML = `<button onclick="removeFromDebt()" style="background:var(--o)">إزالة من المديونية</button>`;
        } else {
            bDiv.innerHTML = `<button onclick="addToDebt()" style="background:var(--p)">نقل للمديونية (استلام كاش)</button>`;
        }
    } else {
        bar.classList.remove("show");
    }
}
function addToDebt() {
    selectedIds.forEach(id => { if(!debtIds.includes(id)) debtIds.push(id); });
    localStorage.setItem(STORAGE.DEBT_IDS, JSON.stringify(debtIds));
    renderCurrentTab();
}
function removeFromDebt() {
    debtIds = debtIds.filter(id => !selectedIds.has(id));
    localStorage.setItem(STORAGE.DEBT_IDS, JSON.stringify(debtIds));
    renderCurrentTab();
}

init();
</script>
</body>
</html>
